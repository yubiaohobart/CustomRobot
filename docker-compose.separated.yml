version: '3.8'

services:
  # 1. 后端 API 服务容器 (Node.js 或替换为 Flask)
  backend-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: intelliserve_backend_api
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    expose:
      - "3000"
    networks:
      - intelliserve_net

  # 2. 前端独立静态托管 Nginx 容器
  frontend-web:
    image: nginx:alpine
    container_name: intelliserve_frontend_web
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.separated.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend-api
    networks:
      - intelliserve_net

networks:
  intelliserve_net:
    driver: bridge
