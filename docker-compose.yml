version: '3.8'

services:
  # Option 1: Node.js Fullstack (Default - Recommended)
  intelliserve-fullstack:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: intelliserve_fullstack
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}

  # Option 2: Python Flask Backend (Optional if running pure Python LangGraph)
  # Uncomment below if you prefer the Python Flask + LangGraph backend:
  # intelliserve-flask:
  #   build:
  #     context: ./flask_backend
  #     dockerfile: Dockerfile.flask
  #   container_name: intelliserve_flask
  #   restart: always
  #   ports:
  #     - "5000:5000"
  #   environment:
  #     - FLASK_ENV=production
  #     - FLASK_PORT=5000
  #     - GEMINI_API_KEY=${GEMINI_API_KEY:-}
