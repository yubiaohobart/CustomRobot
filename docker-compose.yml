services:
  postgres:
    image: postgres:16-alpine
    container_name: intelliserve_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-intelliserve}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./docker_data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-intelliserve}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2.3-alpine
    container_name: intelliserve_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./docker_data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.13.4
    container_name: intelliserve_qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - ./docker_data/qdrant:/qdrant/storage

  # 可选：若宿主机未安装 Ollama，可通过 `docker compose --profile ollama up -d` 启动容器版 Ollama
  ollama:
    image: ollama/ollama:latest
    container_name: intelliserve_ollama
    profiles: ["ollama"]
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ./docker_data/ollama:/root/.ollama

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: intelliserve_backend
    restart: unless-stopped
    ports:
      - "${FASTAPI_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      FASTAPI_HOST: "0.0.0.0"
      FASTAPI_PORT: "8000"
      DEBUG: "false"
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-intelliserve}"
      DB_ECHO: ${DB_ECHO:-false}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
      REDIS_URL: "redis://redis:6379/0"
      SESSION_LOCK_TIMEOUT_SECONDS: ${SESSION_LOCK_TIMEOUT_SECONDS:-5.0}
      SESSION_LOCK_TTL_SECONDS: ${SESSION_LOCK_TTL_SECONDS:-90.0}
      QDRANT_HOST: "qdrant"
      QDRANT_PORT: "6333"
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-xx_mall_faq}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-bge-m3}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      DEEPSEEK_TEMPERATURE: ${DEEPSEEK_TEMPERATURE:-0.3}
      DEEPSEEK_MAX_TOKENS: ${DEEPSEEK_MAX_TOKENS:-1024}
      SIMILARITY_THRESHOLD: ${SIMILARITY_THRESHOLD:-0.65}
      TOP_K_RETRIEVAL: ${TOP_K_RETRIEVAL:-3}
      HYBRID_PREFETCH_LIMIT: ${HYBRID_PREFETCH_LIMIT:-10}
      AUTO_REFUND_LIMIT_YUAN: ${AUTO_REFUND_LIMIT_YUAN:-3.00}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-45.0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: intelliserve_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
