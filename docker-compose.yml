version: '3.8'

services:
  # Option 1: Node.js Fullstack (Default - Recommended)
  intelliserve-fullstack:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: intelliserve_fullstack
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}

  # Option 2: Python FastAPI Backend (Optional if running pure Python LangGraph)
  # Uncomment below if you prefer the Python FastAPI + LangGraph backend:
  # intelliserve-fastapi:
  #   build:
  #     context: ./fastapi_backend
  #     dockerfile: Dockerfile.fastapi
  #   container_name: intelliserve_fastapi
  #   restart: always
  #   ports:
  #     - "5000:5000"
  #   environment:
  #     - FASTAPI_PORT=5000
  #     - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
